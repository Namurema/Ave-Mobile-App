      /* These styles make the body full-height */
      html,

        height: 100%;
      }

        overflow: hidden;
        background-color: #fafafa;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
