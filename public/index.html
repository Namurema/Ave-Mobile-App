    <noscript>
      <main>
        <h1>Ave: Catholic Prayers in English, Luganda and Runyankore</h1>
        <p>Ave is a free Catholic prayer app built for Uganda. Pray in English, Luganda (Oluganda) or Runyankore (Orunyankore), on your phone or computer. Install it from your browser and it works offline. No account is needed.</p>
        <h2>What you can pray</h2>
        <ul>
          <li><a href="/rosary">The Holy Rosary</a>: the Joyful, Sorrowful, Glorious and Luminous Mysteries, and a <a href="/prayer/session">full guided Rosary</a> from the Apostles' Creed to the Hail Holy Queen, including the Fatima Prayer.</li>
          <li>Daily prayers: <a href="/daily-prayer/morning">morning prayers</a>, <a href="/daily-prayer/midday">midday prayers</a> and <a href="/daily-prayer/night">night prayers</a>.</li>
          <li><a href="/novenas">Novenas</a>: the <a href="/novena/2">Novena to Our Lady of Perpetual Help</a> and the <a href="/novena/7">Novena to the 13 Blessed Souls</a>.</li>
          <li><a href="/chaplets">Chaplets</a>: the <a href="/chaplet/1">Chaplet of the Divine Mercy</a>.</li>
          <li><a href="/stations">The Stations of the Cross</a>.</li>
          <li><a href="/other-prayers">Other prayers</a>: <a href="/other-prayer/guadalupe">Our Lady of Guadalupe</a>, <a href="/other-prayer/fatima">Our Lady of Fatima</a> and the <a href="/other-prayer/magnificat">Magnificat</a>.</li>
        </ul>
        <p>Save favourite prayers and track the days you pray, including novena progress. <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms &amp; Conditions</a></p>
        <p>You need to enable JavaScript to use the app.</p>
      </main>
    </noscript>
