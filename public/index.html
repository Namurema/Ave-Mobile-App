        <h1>Ave: Catholic Prayers, Rosary and Novenas in Luganda, Runyankore and English</h1>
        <p>Ave is a Catholic prayer app built for Uganda. Pray in English, Luganda (Oluganda), Runyankore (Orunyankore), Swahili, Spanish or Italian, on your phone or computer. Listen to prayers read aloud, set a daily prayer routine with reminders, and track your novena days. Install it from your browser and it works offline.</p>
        <p>Create a free account to start praying.</p>
        <h2>What you can pray</h2>
        <ul>
          <li><a href="/rosary">The Holy Rosary</a>: the Joyful, Sorrowful, Glorious and Luminous Mysteries, and a <a href="/prayer/session">full guided Rosary</a> from the Apostles' Creed to the Hail Holy Queen, including the Fatima Prayer.</li>
          <li>Daily prayers: <a href="/daily-prayer/morning">morning prayers</a>, <a href="/daily-prayer/midday">midday prayers</a> and <a href="/daily-prayer/night">night prayers</a>.</li>
          <li><a href="/novenas">Novenas</a>: the <a href="/novena/2">Novena to Our Lady of Perpetual Help</a>, the <a href="/novena/6">Novena to St. Jude</a>, the <a href="/novena/7">Novena to the 13 Blessed Souls</a>, the <a href="/novena/8">Novena to Pope St. Leo the Great</a>, the <a href="/novena/9">Novena to Our Lady of Guadalupe</a>, the <a href="/novena/10">Novena to the Holy Name of Jesus</a>, the <a href="/novena/11">Novena to Our Lady of Hope</a>, the <a href="/novena/12">30 Day Novena to St. Joseph</a>, the <a href="/novena/5">Divine Mercy Novena</a>, the <a href="/novena/13">Novena for Fertility</a>, the <a href="/novena/14">Novena to Our Lady of Fatima</a>, the <a href="/novena/15">Novena to St. Dominic</a> and the <a href="/novena/16">Novena to Our Lady of Sorrows</a>.</li>
          <li><a href="/chaplets">Chaplets</a>: the <a href="/chaplet/1">Chaplet of the Divine Mercy</a>.</li>
          <li><a href="/stations">The Stations of the Cross</a>.</li>
          <li><a href="/other-prayers">Other prayers</a>: <a href="/other-prayer/guadalupe">Our Lady of Guadalupe</a>, <a href="/other-prayer/fatima">Our Lady of Fatima</a> and the <a href="/other-prayer/magnificat">Magnificat</a>.</li>
        </ul>
        <p><a href="/">Create your account</a> · <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms &amp; Conditions</a></p>
        <p>You need to enable JavaScript to use the app.</p>
